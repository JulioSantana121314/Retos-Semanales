<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto 1</title>
</head>

<body>
  <h1>Checkout</h1>
  <p>Payment Method
    <select>
      <option>Visa Ending in 4566</option>
      <option>American Express Ending in 9122</option>
      <option>Discover Ending in 9865</option>
    </select>
  </p>
  <form>
  <fieldset>
    <legend>Shipping Method</legend>
    <input type="radio" id="2day">
    <label for="2day">FREE - 2 Day Shipping</label>
    <br>
    <input type="radio" id="stnd">
    <label for="stnd">Standard Shipping (4 - 5 Business Days)</label>
    <br>
    <input type="radio" id="nrsh">
    <label for="nrsh">FREE - No Rush Shipping (5 Business Days)</label>
  </fieldset>
  <p>This is a gift <input type="checkbox" checked></p>
  <button type="submit">Place Your Order</button>
  </form>
</body>
</html>
